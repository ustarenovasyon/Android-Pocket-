name: Test and publish Pocket LSR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node for automated verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signal mathematics and data guards
        run: node --test tests/*.test.mjs
      - name: Validate module syntax
        run: |
          node --check src/app.mjs
          node --check src/engine.mjs
          node --check src/feed.mjs
          node --check src/chart.mjs
      - name: Prepare publishable static assets only
        run: |
          mkdir -p _site
          cp index.html style.css manifest.webmanifest sw.js .nojekyll _site/
          cp -R src assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish live website
        id: deployment
        uses: actions/deploy-pages@v4